<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050a1e"/>
      <stop offset="100%" stop-color="#0f1d4a"/>
    </linearGradient>
    <linearGradient id="fus" x1="-90" y1="100" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8ddf0"/>
      <stop offset="40%" stop-color="#e4eefb"/>
      <stop offset="100%" stop-color="#a8c4e0"/>
    </linearGradient>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="eg"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ds"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>

  <!-- BG -->
  <rect width="900" height="220" fill="url(#bg)" rx="16"/>

  <!-- Grid lines -->
  <g opacity=".035" stroke="#4fc3f7" stroke-width=".5" stroke-dasharray="4 8">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <!-- ========== STARS ========== -->
  <g>
    <circle cx="55" cy="20" r="1.8" fill="#e3f2fd" opacity=".7"><animate attributeName="opacity" values=".7;.1;.7" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="45" r="1.1" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.05;.5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="14" r="1.4" fill="#e3f2fd" opacity=".6"><animate attributeName="opacity" values=".6;.08;.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="35" r="1.0" fill="#fff" opacity=".45"><animate attributeName="opacity" values=".45;.05;.45" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="16" r="1.5" fill="#e3f2fd" opacity=".55"><animate attributeName="opacity" values=".55;.08;.55" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="30" r="1.2" fill="#fff" opacity=".6"><animate attributeName="opacity" values=".6;.1;.6" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="12" r="1.6" fill="#e3f2fd" opacity=".5"><animate attributeName="opacity" values=".5;.06;.5" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="40" r="1.0" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.04;.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="22" r="1.3" fill="#e3f2fd" opacity=".55"><animate attributeName="opacity" values=".55;.08;.55" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="55" r="0.9" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.06;.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="58" r="0.8" fill="#fff" opacity=".35"><animate attributeName="opacity" values=".35;.03;.35" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="50" r="0.9" fill="#e3f2fd" opacity=".4"><animate attributeName="opacity" values=".4;.05;.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="62" r="0.7" fill="#fff" opacity=".3"><animate attributeName="opacity" values=".3;.02;.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="68" r="0.8" fill="#e3f2fd" opacity=".35"><animate attributeName="opacity" values=".35;.04;.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="58" r="0.7" fill="#fff" opacity=".3"><animate attributeName="opacity" values=".3;.03;.3" dur="3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ========== CLOUDS ========== -->
  <g opacity=".09">
    <ellipse cx="110" cy="175" rx="50" ry="13" fill="#fff"><animate attributeName="cx" values="110;150;110" dur="24s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="140" cy="168" rx="35" ry="10" fill="#fff"><animate attributeName="cx" values="140;180;140" dur="24s" repeatCount="indefinite"/></ellipse>
  </g>
  <g opacity=".07">
    <ellipse cx="500" cy="188" rx="42" ry="11" fill="#fff"><animate attributeName="cx" values="500;468;500" dur="20s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="525" cy="182" rx="30" ry="9" fill="#fff"><animate attributeName="cx" values="525;493;525" dur="20s" repeatCount="indefinite"/></ellipse>
  </g>
  <g opacity=".06">
    <ellipse cx="780" cy="178" rx="48" ry="12" fill="#fff"><animate attributeName="cx" values="780;815;780" dur="26s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="808" cy="172" rx="32" ry="10" fill="#fff"><animate attributeName="cx" values="808;843;808" dur="26s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- ========== THE PLANE (nested groups for multi-animation) ========== -->
  <!-- Outer: fly left-to-right -->
  <g filter="url(#ds)">
    <animateTransform attributeName="transform" type="translate" from="-550 0" to="1050 0" dur="9s" repeatCount="indefinite"/>

    <!-- Middle: bob up-down + tilt -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0; 0,5; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0,0,100; 0.6,0,100; 0,0,100; -0.6,0,100; 0,0,100" dur="3.5s" repeatCount="indefinite" additive="sum"/>

      <!-- ===== CONTRAILS ===== -->
      <g opacity=".3" stroke-linecap="round" fill="none">
        <path d="M-100,92 Q-170,89 -260,93" stroke="#6db8d9" stroke-width="3.5">
          <animate attributeName="stroke-dashoffset" values="0;-50" dur="1.5s" repeatCount="indefinite"/>
          <set attributeName="stroke-dasharray" to="12 10"/>
        </path>
        <path d="M-100,100 Q-180,97 -280,102" stroke="#6db8d9" stroke-width="2.5">
          <animate attributeName="stroke-dashoffset" values="0;-45" dur="1.8s" repeatCount="indefinite"/>
          <set attributeName="stroke-dasharray" to="10 12"/>
        </path>
        <path d="M-100,108 Q-165,105 -250,110" stroke="#6db8d9" stroke-width="1.8">
          <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.1s" repeatCount="indefinite"/>
          <set attributeName="stroke-dasharray" to="8 10"/>
        </path>
        <path d="M-100,115 Q-155,113 -225,117" stroke="#6db8d9" stroke-width="1.2">
          <animate attributeName="stroke-dashoffset" values="0;-35" dur="2.4s" repeatCount="indefinite"/>
          <set attributeName="stroke-dasharray" to="6 9"/>
        </path>
      </g>

      <!-- ===== TAIL SECTION ===== -->
      <!-- Vertical stabilizer -->
      <polygon points="-75,82 -98,55 -58,82" fill="#0d47a1"/>
      <line x1="-78" y1="82" x2="-78" y2="60" stroke="#42a5f5" stroke-width=".7" opacity=".5"/>
      <line x1="-80" y1="75" x2="-68" y2="65" stroke="#42a5f5" stroke-width=".4" opacity=".3"/>
      <!-- Horizontal stabilizer top -->
      <polygon points="-75,118 -98,138 -58,118" fill="#0d47a1"/>
      <line x1="-78" y1="118" x2="-78" y2="134" stroke="#42a5f5" stroke-width=".5" opacity=".35"/>
      <!-- Rudder line -->
      <line x1="-88" y1="68" x2="-88" y2="78" stroke="#1565c0" stroke-width=".5" opacity=".4"/>

      <!-- ===== FUSELAGE ===== -->
      <!-- Main body path -->
      <path d="M-95,88 C-98,84 -96,80 -88,78 L72,78 C82,78 88,82 90,88 L92,100 L90,112 C88,118 82,122 72,122 L-88,122 C-96,120 -98,116 -95,112 Z" fill="url(#fus)" stroke="#7fb3d8" stroke-width="1.3"/>

      <!-- Fuselage detail lines (ASCII art feel) -->
      <line x1="-85" y1="89" x2="74" y2="89" stroke="#1565c0" stroke-width=".6" opacity=".28" stroke-dasharray="4 3"/>
      <line x1="-85" y1="111" x2="74" y2="111" stroke="#1565c0" stroke-width=".6" opacity=".28" stroke-dasharray="4 3"/>
      <line x1="-85" y1="100" x2="74" y2="100" stroke="#1565c0" stroke-width=".9" opacity=".2"/>
      <!-- Panel rivets -->
      <circle cx="-70" cy="89" r=".6" fill="#1565c0" opacity=".2"/>
      <circle cx="-50" cy="89" r=".6" fill="#1565c0" opacity=".2"/>
      <circle cx="-30" cy="89" r=".6" fill="#1565c0" opacity=".2"/>
      <circle cx="-10" cy="89" r=".6" fill="#1565c0" opacity=".2"/>
      <circle cx="10" cy="89" r=".6" fill="#1565c0" opacity=".2"/>
      <circle cx="30" cy="89" r=".6" fill="#1565c0" opacity=".2"/>
      <circle cx="50" cy="89" r=".6" fill="#1565c0" opacity=".2"/>

      <!-- ===== NOSE ===== -->
      <path d="M90,88 C92,92 96,96 98,100 C96,104 92,108 90,112 L90,88Z" fill="#d0dff0" stroke="#7fb3d8" stroke-width="1"/>
      <!-- Pitot tube / antenna -->
      <line x1="98" y1="100" x2="108" y2="100" stroke="#7fb3d8" stroke-width=".8" opacity=".5"/>
      <circle cx="108" cy="100" r="1.2" fill="#4fc3f7" opacity=".6">
        <animate attributeName="opacity" values=".6;.15;.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- ===== WINGS ===== -->
      <!-- Top wing -->
      <polygon points="-8,88 30,48 65,82 30,92" fill="url(#wg)" opacity=".93"/>
      <line x1="0" y1="88" x2="50" y2="68" stroke="#e3f2fd" stroke-width=".5" opacity=".25"/>
      <line x1="10" y1="85" x2="40" y2="75" stroke="#e3f2fd" stroke-width=".4" opacity=".2"/>
      <!-- Top wingtip nav light -->
      <circle cx="65" cy="82" r="2.5" fill="#42a5f5" opacity=".7">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="1s" repeatCount="indefinite"/>
      </circle>

      <!-- Bottom wing -->
      <polygon points="-8,112 30,152 65,118 30,108" fill="url(#wg)" opacity=".93"/>
      <line x1="0" y1="112" x2="50" y2="132" stroke="#e3f2fd" stroke-width=".5" opacity=".25"/>
      <!-- Bottom wingtip nav light -->
      <circle cx="65" cy="118" r="2.5" fill="#ef5350" opacity=".7">
        <animate attributeName="opacity" values=".7;.2;.7" dur="1s" repeatCount="indefinite"/>
      </circle>

      <!-- ===== ENGINES ===== -->
      <!-- Top engine nacelle -->
      <rect x="-22" y="60" width="28" height="12" rx="4" fill="#263238" stroke="#455a64" stroke-width=".6"/>
      <ellipse cx="-22" cy="66" rx="3.5" ry="6" fill="#37474f"/>
      <!-- Top engine exhaust glow -->
      <ellipse cx="-36" cy="66" rx="18" ry="7" fill="#ff6f00" opacity=".75" filter="url(#eg)">
        <animate attributeName="opacity" values=".75;.3;.75" dur=".3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-50" cy="66" rx="12" ry="4" fill="#ffab40" opacity=".35" filter="url(#eg)">
        <animate attributeName="opacity" values=".35;.1;.35" dur=".35s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Bottom engine nacelle -->
      <rect x="-22" y="148" width="28" height="12" rx="4" fill="#263238" stroke="#455a64" stroke-width=".6"/>
      <ellipse cx="-22" cy="154" rx="3.5" ry="6" fill="#37474f"/>
      <!-- Bottom engine exhaust glow -->
      <ellipse cx="-36" cy="154" rx="18" ry="7" fill="#ff6f00" opacity=".75" filter="url(#eg)">
        <animate attributeName="opacity" values=".75;.3;.75" dur=".3s" repeatCount="indefinite" begin=".15s"/>
      </ellipse>
      <ellipse cx="-50" cy="154" rx="12" ry="4" fill="#ffab40" opacity=".35" filter="url(#eg)">
        <animate attributeName="opacity" values=".35;.1;.35" dur=".35s" repeatCount="indefinite" begin=".15s"/>
      </ellipse>

      <!-- ===== COCKPIT ===== -->
      <path d="M80,93 C86,93 90,96 91,100 C90,104 86,107 80,107 C83,100 80,93 80,93Z" fill="#0d1b3e" opacity=".55" stroke="#5c6bc0" stroke-width=".6"/>
      <!-- Cockpit glare -->
      <path d="M82,95 C85,95 87,97 87,99" stroke="#90caf9" stroke-width="1" fill="none" opacity=".35"/>
      <path d="M83,96 C85,96 86,97 86,98" stroke="#e3f2fd" stroke-width=".5" fill="none" opacity=".3"/>

      <!-- ===== PASSENGER WINDOWS ===== -->
      <g>
        <circle cx="18" cy="94" r="3" fill="#0d1b3e" opacity=".55" stroke="#4fc3f7" stroke-width=".6">
          <animate attributeName="stroke-opacity" values=".6;.15;.6" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="31" cy="94" r="3" fill="#0d1b3e" opacity=".55" stroke="#4fc3f7" stroke-width=".6">
          <animate attributeName="stroke-opacity" values=".6;.15;.6" dur="4s" repeatCount="indefinite" begin=".6s"/>
        </circle>
        <circle cx="44" cy="94" r="3" fill="#0d1b3e" opacity=".55" stroke="#4fc3f7" stroke-width=".6">
          <animate attributeName="stroke-opacity" values=".6;.15;.6" dur="4s" repeatCount="indefinite" begin="1.2s"/>
        </circle>
        <circle cx="57" cy="94" r="3" fill="#0d1b3e" opacity=".55" stroke="#4fc3f7" stroke-width=".6">
          <animate attributeName="stroke-opacity" values=".6;.15;.6" dur="4s" repeatCount="indefinite" begin="1.8s"/>
        </circle>
        <circle cx="70" cy="94" r="3" fill="#0d1b3e" opacity=".55" stroke="#4fc3f7" stroke-width=".6">
          <animate attributeName="stroke-opacity" values=".6;.15;.6" dur="4s" repeatCount="indefinite" begin="2.4s"/>
        </circle>
      </g>

      <!-- ===== FLYPICK LIVERY TEXT ===== -->
      <text x="-24" y="104" font-family="'Courier New','Lucida Console',monospace" font-weight="900" font-size="17" fill="#0d47a1" letter-spacing="4" filter="url(#gl)">FLYPICK</text>
      <text x="-24" y="104" font-family="'Courier New','Lucida Console',monospace" font-weight="900" font-size="17" fill="#64b5f6" letter-spacing="4" opacity=".12" filter="url(#gl)">FLYPICK</text>

      <!-- Registration number -->
      <text x="-68" y="118" font-family="'Courier New',monospace" font-size="5" fill="#1565c0" opacity=".4" letter-spacing="1.5">PK-FLY</text>
      <!-- Underbelly stripe -->
      <line x1="-20" y1="118" x2="60" y2="118" stroke="#1565c0" stroke-width=".4" opacity=".25" stroke-dasharray="2 3"/>
    </g>
  </g>

  <!-- ========== SPEED LINES (static, behind plane path) ========== -->
  <g opacity=".06" stroke="#64b5f6" stroke-width="1" stroke-linecap="round">
    <line x1="200" y1="85" x2="320" y2="85"/>
    <line x1="250" y1="100" x2="400" y2="100"/>
    <line x1="220" y1="115" x2="350" y2="115"/>
    <line x1="500" y1="92" x2="600" y2="92"/>
    <line x1="550" y1="108" x2="680" y2="108"/>
    <line x1="530" y1="122" x2="640" y2="122"/>
  </g>

  <!-- ========== TAGLINE ========== -->
  <text x="450" y="212" text-anchor="middle" font-family="'Courier New','Lucida Console',monospace" font-size="11" fill="#5c8ab5" opacity=".45" letter-spacing="5">"From Global Stores to Your Door." · "Your picks, our trips."</text>
</svg>
